<html>
<head>
    <title>Flexbox Example</title>
    <link rel="stylesheet" type="text/css" href="./css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a href="#" class="navbar-brand">TechStore</a>

            <button class="btn btn-outline-light">
                Login
            </button>
        </div>
    </nav>
    

    <!-- Flexbox Section -->
    <div class="container my-5">

        <!-- Horizontal Flexbox Section -->
        <h2 class="section-title">
            Flexbox Horizontal Layout (flex-direction: row)
        </h2>

        <div class="books-horizontal">
            <div class="book">JavaScript</div>
            <div class="book">TypeScript</div>
            <div class="book">ReactJS</div>
            <div class="book">NodeJS</div>
        </div>

        <hr class="my-5">

        <!-- Vertical Flexbox Section -->
        <h2 class="section-title">
            Flexbox Vertical Layout (flex-direction: column)
        </h2>

        <div class="books-vertical">
            <div class="book">JavaScript</div>
            <div class="book">TypeScript</div>
            <div class="book">ReactJS</div>
            <div class="book">NodeJS</div>
        </div>

    </div>
    <footer>
        <p>&copy; 2026 My Website</p>   
    </footer>
</body>
</html>
